<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.name | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">Jianhui Yan<span>.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/#experience' | relative_url }}">Experience</a>
      <a class="nav-cv" href="{{ '/assets/Curriculum_Vitae.pdf' | relative_url }}">CV ↗</a>
    </nav>
  </div></header>
  <main id="main" class="site-main{% unless page.homepage %} document-page{% endunless %}">
    {% unless page.homepage %}<a class="back-link" href="{{ '/#research' | relative_url }}">← Back to homepage</a><h1>{{ page.title }}</h1>{% endunless %}
    {{ content }}
  </main>
  <footer class="site-footer"><span>Jianhui Yan · Human–Computer Interaction</span><a href="mailto:{{ site.author.email }}">Get in touch ↗</a></footer>
</body>
</html>
